  Muhenkan = 0x008B #無変換
  Henkan = 0x008A #変換
  Kana2 = 0x0088 #カナ/かな

# ワンショット漢直　シフトキー
  HEN_KANA = Henkan | Lang1 #変換(Winodws) | かな(MacOS)

# システム別のキー定義
# MacOS 標準IME Windows風のキー操作をON 条件で設定
# ucytpe コンパイルして、実行ファイルにパスを通す

[system="MacOS" ]
  ime_on = !V_Composition V_IMEState Lang1 # かなオン
  ime_off = !V_Composition !V_IMEState 16ms Lang2 # かなオフ
  ime_complete = !V_Composition (Control M)

  CHR = $(uctype "$0")
  STR = CHR["$0"] ^

  iCHR = ime_complete CHR["$0"]
  iSTR = iCHR["$0"] ^

  PREV = Control{P} 32ms # 1行戻る
  NEXT = Control{N} 32ms # 1行進む
  HOME = Control{A} 32ms # {Home}
  END = Control{E} 32ms # {End}
  BUN_MATU = Meta{ArrowDown} #文末に移動
  COPY = Meta{C} 32ms
  PASTE = !V_Composition Meta{V{32ms}}
  CUT = Meta{X} 32ms
  SAI_HEN = V_Composition Lang1 Lang1 # 再変換
  KATA_HEN = Control{I} # ^i カタカナ
  HIRA_HEN = Control{U} # ^u ひらがな
  SAVE = Meta{S} # ファイル保存
  Undo = Meta{Z} # Undo
  Redo = Shift{Meta{Z}} # Redo
  CLIP_CLR = CHR["　"] (Shift Control){B} 24ms Meta{X} 24ms

[system="Windows"]
  ime_on = !V_Composition V_IMEState Lang1 # かなオン
  ime_off = !V_Composition !V_IMEState 16ms Lang2 # かなオフ
  ime_complete = !V_Composition Enter
  ime_pause = Lang2
  ime_resume = Lang1

  CHR = "$0" Enter
  STR = ime_pause "$0" ime_resume ^

  iCHR = ime_complete "$0" Enter
  iSTR = ime_complete ime_pause "$0" ime_resume ^

  PREV = ArrowRight # 1行戻る 縦書き 右移動
  NEXT = ArrowLeft # 1行進む 縦書き 左移動
  HOME = Home # {Home}
  END = End # {End}
  BUN_MATU = Control{End} #文末に移動
  COPY = Control{C}
  PASTE = Control{V{130ms}}
  CUT = Control{X}
  SAI_HEN = M_{Slash} V_IMEState # 再変換
  KATA_HEN = F7 # ^i カタカナ
  HIRA_HEN = F6 # ^u ひらがな
  SAVE = Control{S} # ファイル保存
  Undo = Control{Z} # Undo
  Redo = Control{Y} # Redo
  CLIP_CLR = Enter{24ms} Space Shift{Home} Control{X} Backspace # コピークリア

[system="Linux"]
# Mozcのキー設定をします
# 直接入力	   Henkan	IMEを有効化
# 入力文字無し Muhenkan IMEを無効化

  ime_on = !V_Composition V_IMEState Convert# かなオン
  ime_off = !V_Composition !V_IMEState 16ms NonConvert # かなオフ
  ime_complete = !V_Composition (Control M)

# クリップボードに文字を渡すためにxselをインストールをする
# ================================================
# Linuxはクリップボードをセカンダリに一時退避して、ペースト後に復元する
# 退避するデータはテキストデータに限る
# 環境によっては固定名詞、記号入力ができない
# ================================================
  CHR = \
    $(xsel -o -b | xsel -i -s && printf $0 | xsel -i -b) 64ms  REM[/*セカンダリにコピーしクリップボードに文字列を設定*/] \
    Control{V} 64ms  REM[/*ペースト*/] \
    $(xsel -o -s | xsel -i -b) 64ms  REM[/*セカンダリからクリップボードの文字列を復元*/] \
    $(printf "" | xsel -i -s)  REM[/*セカンダリをリセット*/]

  STR = CHR["$0"] ^
# ================================================

  iCHR = ime_complete 32ms CHR["$0"]
  iSTR = iCHR["$0"] ^

  PREV = ArrowRight # 1行戻る 縦書き 右移動
  NEXT = ArrowLeft # 1行進む 縦書き 左移動
  HOME = Home # {Home}
  END = End # {End}
  BUN_MATU = Control{End} #文末に移動
  COPY = Control{C}
  PASTE = Control{V{130ms}}
  CUT = Control{X}
  SAI_HEN = M_{Slash} V_IMEState # 再変換
  KATA_HEN = F7 # ^i カタカナ
  HIRA_HEN = F6 # ^u ひらがな
  SAVE = Control{S} # ファイル保存
  Undo = Control{Z} # Undo
  Redo = Control{Y} # Redo
  CLIP_CLR = Enter{24ms} Space Shift{Home} Control{X} Backspace # コピークリア

# 薙刀式　定義開始
# =============================================
# 英数モード
# =============================================
# Controlが押下時の配列をQwertyままか、変更後のキー配列に変更するかコメントアウトで選択する
#
[modifier = "!V_NaginataOff !V_IMEState !Meta !Alt !Control"] # Control + Qwerty
# [modifier = "!V_NaginataOff !V_IMEState !Meta !Alt"]        # Control + 変更後のキー配列

# キーリピート 機能キー
# 編集モード1
# D F 右手
  (D F){ O{300ms} } >> DEL
  (D F){ J{300ms} } >> UP
  (D F){ K{300ms} } >> (Shift UP)
  (D F){ M{300ms} } >> DOWN
  (D F){ Comma{300ms} } >> (Shift DOWN)

# 編集モード2
# C V 右手
  (C V){ J{300ms} } >> LEFT
  (C V){ K{300ms} } >> RIGHT
  (C V){ M{300ms} } >> (Shift LEFT)
  (C V){ Comma{300ms} } >> (Shift RIGHT)

# ********** 4キー同時 **********
# S D F 右手
  RRR[  , 7, 8, 9,  , S D F, _,U,I,O,_ ]
  RRR[  , 4, 5, 6,  , S D F, _,J,K,L,_ ]
  RRR[ 0, 1, 2, 3,  , S D F, N,M,Comma,Period,_ ]

# ********** 3キー同時 **********
# 編集モード1
# D F 右手
  RRR[          HOME^, S_{END} BS^,  SAI_HEN^,          DEL^, S_{ESCx[3]}^, D F, Y,U,I,O,P ]
  RRR[ S_{Enter} END^,         UP^,   S_{UP}^,   S_{UPx[7]}^,    KATA_HEN^, D F, H,J,K,L,Semicolon]
  RRR[           END^,       DOWN^, S_{DOWN}^, S_{DOWNx[7]}^,    HIRA_HEN^, D F, N,M,Comma,Period,Slash ]
# 左手 J K
  LLL[    BUN_MATU^, CHR["／"]^,           ,      SAVE^, CHR["・"]^, J K, Q,W,E,R,T ]
  LLL[ STR["……"] , CHR["『"]^, CHR["？"]^, CHR["「"]^, CHR["（"]^, J K, A,S,D,F,G ]
  LLL[ CHR["――"]^, CHR["』"]^, CHR["！"]^, CHR["」"]^, CHR["）"]^, J K, Z,X,C,V,B ]

# 編集モード2
# C V 右手
  RRR[ S_{HOME}^,      CUT^,   SAI_HEN^,        PASTE^,          Undo^, C V, Y,U,I,O,P ]
  RRR[     COPY^,     LEFT^,     RIGHT^, S_{LEFTx[7]}^, S_{RIGHTx[7]}^, C V, H,J,K,L,Semicolon ]
  RRR[  S_{END}^, S_{LEFT}^, S_{RIGHT}^, END S_{HOME}^,          Redo^, C V, N,M,Comma,Period,Slash]
# 左手 M Comma
  (M Comma Q) >> CHR["｜"] ^
  (M Comma W) >> STR["　　　×　　　×　　　×"] Enter
  (M Comma E) >> HOME PREV END DEL DEL NEXT ^
  (M Comma R) >> HOME Enter{24ms} Space NEXT ^
  (M Comma T) >> CHR["〇"] ^

  (M Comma A) >> CHR["《"] ^
  (M Comma S) >> CHR["【"] ^
  (M Comma D) >> HOME PREV END DEL DEL DEL DEL NEXT ^
  (M Comma F) >> HOME CR{24ms} Space Space Space NEXT ^
  (M Comma G) >> Space Space Space ^

  (M Comma Z) >> CHR["》"] ^
  (M Comma X) >> CHR["】"] ^
  (M Comma C) >> CHR["」"] Enter ^
  (M Comma V) >> CHR["」"] Enter CHR["「"] ^
  (M Comma B) >> CHR["」"] Enter Space ^

# ********** 2キー同時 **********
# 機能部分
  (H J) >> ime_on !V_Shift_en ^
  (F G) >> ime_off ^
  (V M) >> Enter ^

  (V_Shift_en Enter) >> ime_on !V_Shift_en ^ # シフト英数モードからエンター、かなモード復帰

