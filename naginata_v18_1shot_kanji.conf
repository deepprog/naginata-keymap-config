# 編集モード1
# D F 右手
  RRR[          HOME^, S_{END} BS^,  SAI_HEN^,          DEL^, S_{ESCx[3]}^, D F, Y,U,I,O,P ]
  RRR[ S_{Enter} END^,         UP^,   S_{UP}^,   S_{UPx[7]}^,    KATA_HEN^, D F, H,J,K,L,Semicolon ]
  RRR[           END^,       DOWN^, S_{DOWN}^, S_{DOWNx[7]}^,    HIRA_HEN^, D F, N,M,Comma,Period,Slash ]
# 左手 J K
# (J K E) は「でぃ」で使う
  LLL[     BUN_MATU^, iCHR["／"]^,            ,       SAVE^, NAKA_GURO[中黒], J K, Q,W,_,R,T ]
  LLL[ iSTR["……"] , iCHR["『"]^, iCHR["？"]^, iCHR["「"]^,     iCHR["（"]^, J K, A,S,D,F,G ]
  LLL[ iCHR["――"]^, iCHR["』"]^, iCHR["！"]^, iCHR["」"]^,     iCHR["）"]^, J K, Z,X,C,V,B ]

# 編集モード2
# C V 右手
  RRR[ S_{HOME}^,      CUT^,   SAI_HEN^,        PASTE^,          Undo^, C V, Y,U,I,O,P ]
  RRR[     COPY^,     LEFT^,     RIGHT^, S_{LEFTx[7]}^, S_{RIGHTx[7]}^, C V, H,J,K,L,Semicolon ]
  RRR[  S_{END}^, S_{LEFT}^, S_{RIGHT}^, END S_{HOME}^,          Redo^, C V, N,M,Comma,Period,Slash]

# 左手 M Comma
  (M Comma Q) >> iCHR["｜"] ^
  (M Comma W) >> iSTR["　　　×　　　×　　　×"] Enter
  (M Comma E) >> HOME PREV END DEL DEL NEXT ^
  (M Comma R) >> HOME Enter{24ms} Space NEXT ^
  (M Comma T) >> iCHR["〇"] ^

  (M Comma A) >> iCHR["《"] ^
  (M Comma S) >> iCHR["【"] ^
  (M Comma D) >> HOME PREV END DEL DEL DEL DEL NEXT ^
  (M Comma F) >> HOME CR{24ms} Space Space Space NEXT ^
  (M Comma G) >> Space Space Space ^

  (M Comma Z) >> iCHR["》"] ^
  (M Comma X) >> iCHR["】"] ^
  (M Comma C) >> iCHR["」"] Enter ^
  (M Comma V) >> iCHR["」"] Enter CHR["「"] ^
  (M Comma B) >> iCHR["」"] Enter Space ^

